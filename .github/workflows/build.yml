name: build-windows-updater

# 云端编译：本地不需要装 Rust，打 tag 或手动触发后由 GitHub Actions 在 Windows runner 上出 exe。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布使用的 tag（留空则按 Cargo.toml 版本自动生成 v<version>）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整 tag 历史，否则 action-gh-release 无法识别当前提交对应的 tag。
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
            if [ -z "$version" ]; then
              echo "无法从 Cargo.toml 解析 version" >&2
              exit 1
            fi
            tag="v${version}"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${tag}"

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload exe to Release
        uses: softprops/action-gh-release@v2
        with:
          # 显式指定 tag：workflow_dispatch 场景没有 tag 上下文，缺了这行就会报
          # "GitHub Releases requires a tag"。tag 不存在时由 GitHub 在 target_commitish 上创建。
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: target/x86_64-pc-windows-msvc/release/generic-updater.exe
          fail_on_unmatched_files: true

name: build-windows-release

# 一条龙：编译 Rust 更新器 + C++ GUI → 打包 zip → 出 SHA256 与（可选签名）feed
# → 按 CHANGELOG 抽发布说明 → 挂到 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布使用的 tag（留空则按 Cargo.toml 版本自动生成 v<version>）"
        required: false
        default: ""

permissions:
  contents: write

env:
  # 配了 secret 就签元数据；updater.conf 里的 require_signature 决定客户端是否强制验签。
  UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # platform / variant / product / feed 名都从 updater.conf 派生，
      # 脚手架换了平台也不会和 CI 里写死的名字对不上。
      - name: Read updater.conf
        id: conf
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $values = @{}
          foreach ($line in Get-Content updater.conf -Encoding utf8) {
            $trimmed = $line.Trim()
            if (-not $trimmed -or $trimmed.StartsWith('#') -or $trimmed.StartsWith('[')) { continue }
            $index = $trimmed.IndexOf('=')
            if ($index -lt 0) { continue }
            $values[$trimmed.Substring(0, $index).Trim()] = $trimmed.Substring($index + 1).Trim()
          }
          $platform = $values['platform']; if (-not $platform) { $platform = 'windows-x64' }
          $variant = $values['variant']; if (-not $variant) { $variant = 'portable' }
          $product = $values['product']; if (-not $product) { $product = 'app' }
          $exeName = $values['exe_name']; if (-not $exeName) { $exeName = 'app.exe' }
          $feedName = $values['feed_name']; if (-not $feedName) { $feedName = "latest-version-$platform.json" }
          $targets = @{
            'windows-x64'   = @('x86_64-pc-windows-msvc', 'x64')
            'windows-arm64' = @('aarch64-pc-windows-msvc', 'arm64')
          }
          if (-not $targets.ContainsKey($platform)) {
            throw "updater.conf 的 platform=$platform 不受 build.yml 支持（可选：$($targets.Keys -join ', ')）"
          }
          "platform=$platform" >> $env:GITHUB_OUTPUT
          "variant=$variant" >> $env:GITHUB_OUTPUT
          "product=$product" >> $env:GITHUB_OUTPUT
          "exe_name=$exeName" >> $env:GITHUB_OUTPUT
          "feed_name=$feedName" >> $env:GITHUB_OUTPUT
          "triple=$($targets[$platform][0])" >> $env:GITHUB_OUTPUT
          "arch=$($targets[$platform][1])" >> $env:GITHUB_OUTPUT
          "platform/variant/product: $platform / $variant / $product"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ steps.conf.outputs.arch }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.conf.outputs.triple }}

      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
            tag="v${version}"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac
          version="${tag#v}"
          version="${version%%_*}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${tag} (version ${version})"

      # 配置是编译期固化的：先检查 require_signature 和 secret 是否自洽。
      - name: Check signing configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $requireSignature = ((Get-Content updater.conf | Where-Object { $_ -match '^require_signature=' }) -split '=')[1].Trim()
          $hasSecret = -not [string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY)
          "require_signature=$requireSignature hasSecret=$hasSecret"
          if ($requireSignature -eq "true" -and -not $hasSecret) {
            throw "updater.conf 要求签名（require_signature=true），但仓库没有配置 UPDATE_SIGNING_KEY secret。"
          }
          if ($requireSignature -ne "true" -and $hasSecret) {
            Write-Warning "已配置签名 secret，但 require_signature=false：会签名，但客户端不会强制验签。"
          }
          if ($hasSecret) {
            $keys = @((Get-Content resources/update-trusted-keys.json -Raw | ConvertFrom-Json).keys)
            if ($keys.Count -eq 0) {
              throw "已配置 UPDATE_SIGNING_KEY，但 resources/update-trusted-keys.json 里没有公钥。先运行 scripts/new-release-key.ps1 并提交公钥文件。"
            }
          }

      - name: Build updater (Rust)
        run: cargo build --release --target ${{ steps.conf.outputs.triple }}

      - name: Build GUI client (C++)
        shell: cmd
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: client\build-msvc.bat

      - name: Package portable zip and metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          PLATFORM: ${{ steps.conf.outputs.platform }}
          VARIANT: ${{ steps.conf.outputs.variant }}
          PRODUCT: ${{ steps.conf.outputs.product }}
          EXE_NAME: ${{ steps.conf.outputs.exe_name }}
          FEED_NAME: ${{ steps.conf.outputs.feed_name }}
          TARGET_TRIPLE: ${{ steps.conf.outputs.triple }}
        run: |
          $ErrorActionPreference = "Stop"

          # 版本以 tag 为准，不再依赖 Cargo.toml：打 v0.5.1 就发 0.5.1。
          $version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { throw "没有解析到发布版本号" }
          $product = $env:PRODUCT
          $zipName = "$product-$version-$env:PLATFORM-$env:VARIANT.zip"

          $payload = "build\payload"
          New-Item -ItemType Directory -Force $payload | Out-Null
          # 本仓库的示例客户端固定叫 GuiUpdaterDemo.exe；脚手架换了 exe_name 时按配置改名。
          $guiExe = "dist\GuiUpdaterDemo.exe"
          if (-not (Test-Path $guiExe)) { throw "没有找到 $guiExe，先确认 client\build-msvc.bat 构建成功" }
          Copy-Item $guiExe "$payload\$($env:EXE_NAME)"
          Copy-Item "target\$($env:TARGET_TRIPLE)\release\generic-updater.exe" "$payload\generic-updater.exe"
          Set-Content -Path "$payload\version.txt" -Value $version -Encoding ascii

          New-Item -ItemType Directory -Force "build\out" | Out-Null
          Compress-Archive -Path "$payload\*" -DestinationPath "build\out\$zipName" -Force

          $size = (Get-Item "build\out\$zipName").Length
          $sha = (Get-FileHash "build\out\$zipName" -Algorithm SHA256).Hash.ToLower()
          # GitHub 资产现在自带 digest，但 Gitee 镜像/手工下载/WinGet 清单都依赖这个旁置文件。
          Set-Content -Path "build\out\$zipName.sha256" -Value "$sha  $zipName" -Encoding ascii

          # 发布说明：从 CHANGELOG.md 里抽当前版本小节，顺序固定 新增 → 修改 → 删除。
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+$([regex]::Escape($version))\s*\r?\n(.*?)(?=^##\s|\z)"
          if ($changelog -match $pattern) {
            $notes = $Matches[1].Trim()
          } else {
            Write-Warning "CHANGELOG.md 里没有 $version 小节，退回使用提交信息。"
            $notes = ((git log -1 --pretty=%B) -join "`n").Trim()
          }
          Set-Content -Path "build\out\notes.md" -Value $notes -Encoding utf8

          $feed = [ordered]@{
            schema      = 1
            product     = $product
            version     = $version
            publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platform    = $env:PLATFORM
            notes       = $notes
            packages    = @(
              [ordered]@{
                variant = $env:VARIANT
                kind    = $env:VARIANT
                path    = $zipName
                size    = $size
                sha256  = $sha
              }
            )
          }
          $feed | ConvertTo-Json -Depth 6 | Set-Content -Path "build\out\$($env:FEED_NAME)" -Encoding utf8

          Get-ChildItem build\out | Select-Object Name, Length

      - name: Sign update metadata (RSA-PSS)
        if: ${{ env.UPDATE_SIGNING_KEY != '' }}
        shell: pwsh
        env:
          FEED_NAME: ${{ steps.conf.outputs.feed_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $keyPath = Join-Path $env:RUNNER_TEMP "update-signing.pem"
          [IO.File]::WriteAllText($keyPath, $env:UPDATE_SIGNING_KEY, [Text.UTF8Encoding]::new($false))
          ./scripts/sign-feed.ps1 `
            -FeedPath "build/out/$($env:FEED_NAME)" `
            -PrivateKeyPath $keyPath `
            -PublicKeysPath resources/update-trusted-keys.json
          Remove-Item $keyPath -Force

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: build/out/notes.md
          files: |
            build/out/${{ steps.conf.outputs.feed_name }}
            build/out/*.zip
            build/out/*.sha256
          fail_on_unmatched_files: true




[package]
name = "GuiUpdaterDemo"
version = "0.6.0"
edition = "2021"
description = "示例便携客户端：本地便签 + 外置更新器驱动（Rust 版）"
publish = false

[[bin]]
name = "GuiUpdaterDemo"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
build-common = { path = "../build-common" }

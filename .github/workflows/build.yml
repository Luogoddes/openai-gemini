name: build-windows-updater

# 云端编译：本地不需要装 Rust。打 tag 或手动触发后由 GitHub Actions 在 Windows runner
# 上编译 exe，再打包 portable zip、算 SHA256、生成 latest-version-windows-x64.json，
# 一并挂到 Release。客户端信任链就是"元数据里的 sha256 + 这个 zip"。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布使用的 tag（留空则按 Cargo.toml 版本自动生成 v<version>）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整 tag 历史，否则 action-gh-release 无法识别当前提交对应的 tag。
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
            if [ -z "$version" ]; then
              echo "无法从 Cargo.toml 解析 version" >&2
              exit 1
            fi
            tag="v${version}"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${tag}"

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package portable zip, checksums and feed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $product = "generic-updater"
          $zipName = "$product-$version-windows-x64-portable.zip"

          New-Item -ItemType Directory -Force "dist/payload" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/generic-updater.exe" "dist/payload/generic-updater.exe"
          Copy-Item "config.example.json" "dist/payload/config.example.json"
          Set-Content -Path "dist/payload/version.txt" -Value $version -Encoding ascii

          Compress-Archive -Path "dist/payload/*" -DestinationPath "dist/$zipName" -Force

          $size = (Get-Item "dist/$zipName").Length
          $sha = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLower()
          # snow-shot 风格的旁置校验文件，方便手工核对
          Set-Content -Path "dist/$zipName.sha256" -Value "$sha  $zipName" -Encoding ascii

          $notes = (git log -1 --pretty=%B).Trim()
          $feed = [ordered]@{
            schema      = 1
            product     = $product
            version     = $version
            publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platform    = "windows-x64"
            notes       = $notes
            packages    = @(
              [ordered]@{
                variant = "portable"
                kind    = "portable"
                path    = $zipName
                size    = $size
                sha256  = $sha
              }
            )
          }
          $feed | ConvertTo-Json -Depth 6 | Set-Content -Path "dist/latest-version-windows-x64.json" -Encoding utf8

          Get-ChildItem dist -File | Select-Object Name, Length

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          # 显式指定 tag：workflow_dispatch 场景没有 tag 上下文，缺了这行就会报
          # "GitHub Releases requires a tag"。tag 不存在时由 GitHub 在 target_commitish 上创建。
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/latest-version-windows-x64.json
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true

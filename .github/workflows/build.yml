name: build-windows-release

# 一条龙：编译 Rust 更新器 + C++ GUI 客户端 → 打包 zip → 出 SHA256 与（可选签名）feed
# → 挂到 Release。打 v* tag 或手动触发都会跑，产物可被客户端直接消费做真实升级测试。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布使用的 tag（留空则按 Cargo.toml 版本自动生成 v<version>）"
        required: false
        default: ""

permissions:
  contents: write

env:
  # 配了 secret 就签元数据，客户端 require_signature 也会自动切成 true；没配就是未签名演示模式。
  UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
            tag="v${version}"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${tag}"

      - name: Build updater (Rust)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build GUI client (C++)
        shell: cmd
        run: app\build-msvc.bat

      - name: Package portable zip and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $product = "generic-updater"
          $zipName = "$product-$version-windows-x64-portable.zip"
          $signed = -not [string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY)

          $payload = "build\payload"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item "dist\GuiUpdaterDemo.exe" "$payload\GuiUpdaterDemo.exe"
          Copy-Item "target\x86_64-pc-windows-msvc\release\generic-updater.exe" "$payload\generic-updater.exe"
          Set-Content -Path "$payload\version.txt" -Value $version -Encoding ascii
          Set-Content -Path "$payload\README.txt" -Value "Generic Updater Demo $version`nRun GuiUpdaterDemo.exe; generic-updater.exe must stay in the same folder." -Encoding utf8

          # 打包进 zip 的 app.ini 决定客户端是否强制要求签名，必须和本次发布是否签名一致。
          $requireSignature = if ($signed) { "true" } else { "false" }
          (Get-Content app\app.ini -Raw) -replace '(?m)^require_signature=.*$', "require_signature=$requireSignature" |
            Set-Content -Path "$payload\app.ini" -Encoding utf8

          New-Item -ItemType Directory -Force "build\out" | Out-Null
          Compress-Archive -Path "$payload\*" -DestinationPath "build\out\$zipName" -Force

          $size = (Get-Item "build\out\$zipName").Length
          $sha = (Get-FileHash "build\out\$zipName" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "build\out\$zipName.sha256" -Value "$sha  $zipName" -Encoding ascii

          # git log 在 PowerShell 里是字符串数组，先 join 再 trim，否则 notes 会变成数组。
          $notes = ((git log -1 --pretty=%B) -join "`n").Trim()
          $feed = [ordered]@{
            schema      = 1
            product     = $product
            version     = $version
            publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platform    = "windows-x64"
            notes       = $notes
            packages    = @(
              [ordered]@{
                variant = "portable"
                kind    = "portable"
                path    = $zipName
                size    = $size
                sha256  = $sha
              }
            )
          }
          $feed | ConvertTo-Json -Depth 6 | Set-Content -Path "build\out\latest-version-windows-x64.json" -Encoding utf8

          "signed=$signed require_signature=$requireSignature"
          Get-ChildItem build\out | Select-Object Name, Length

      - name: Sign update metadata (RSA-PSS)
        if: ${{ env.UPDATE_SIGNING_KEY != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $keyPath = Join-Path $env:RUNNER_TEMP "update-signing.pem"
          [IO.File]::WriteAllText($keyPath, $env:UPDATE_SIGNING_KEY, [Text.UTF8Encoding]::new($false))
          ./tools/sign-feed.ps1 `
            -FeedPath build/out/latest-version-windows-x64.json `
            -PrivateKeyPath $keyPath `
            -PublicKeysPath resources/update-trusted-keys.json
          Remove-Item $keyPath -Force

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            build/out/latest-version-windows-x64.json
            build/out/*.zip
            build/out/*.sha256
          fail_on_unmatched_files: true
